name: frontend

on:
  pull_request:
    paths:
      - frontend/**
      - .github/workflows/frontend.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/setup@v3.2.0
        with:
          working-directory: frontend
          cache: true
          require-lockfile: true
      - run: pnpm tsc
      - run: pnpm biome
      - run: pnpm eslint
      - run: pnpm build
